version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: viajesq_prod_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: viajesq
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/migration.sql:/docker-entrypoint-initdb.d/migration.sql
      - ./backend/migration2.sql:/docker-entrypoint-initdb.d/migration2.sql
      - ./backend/fix.sql:/docker-entrypoint-initdb.d/z_fix.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: viajesq_prod_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: viajesq
      JWT_SECRET: my_super_secret_jwt_key_123
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: viajesq_prod_frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata_prod:
  caddy_data:
  caddy_config:
